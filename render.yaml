# Creates only Free resources. Review the plans in Render before applying.
services:
  - type: web
    name: typeway-backend
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: bash build.sh
    startCommand: bash start.sh
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.7
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        value: https://hannah14295.github.io
      - key: DATABASE_URL
        fromDatabase:
          name: typeway-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: typeway-live
          type: keyvalue
          property: connectionString
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false

  - type: keyvalue
    name: typeway-live
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: typeway-db
    plan: free
    region: oregon
    databaseName: typeway
    user: typeway
    ipAllowList: []
